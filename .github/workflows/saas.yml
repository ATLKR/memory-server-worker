name: Memory SaaS

on:
  pull_request:
    paths: ['saas/**', '.github/workflows/saas.yml']
  push:
    branches: [master, main, 'feat/saas-*']
    paths: ['saas/**', '.github/workflows/saas.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: saas/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:d1
