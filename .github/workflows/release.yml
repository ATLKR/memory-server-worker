name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signed release tag and package version
        run: |
          set -euo pipefail
          node .github/scripts/validate-release-tag.mjs "$GITHUB_REF_NAME"
          git -c "gpg.ssh.allowedSignersFile=$GITHUB_WORKSPACE/.github/allowed_signers" \
            verify-tag "$GITHUB_REF_NAME"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$(git rev-parse HEAD)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: git diff --exit-code -- packages/memory-worker/env.d.ts
      - run: npm run check
      - run: npm run build:plugin-artifact
      - run: git diff --exit-code -- allenlim-memory-server-chatgpt.zip allenlim-memory-server-chatgpt.zip.sha256
      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          npm sbom --sbom-format cyclonedx > "release-assets/memory-server-worker-${GITHUB_REF_NAME}-sbom.cdx.json"
          cp allenlim-memory-server-chatgpt.zip allenlim-memory-server-chatgpt.zip.sha256 release-assets/
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const sbom = JSON.parse(readFileSync(`release-assets/memory-server-worker-${process.env.GITHUB_REF_NAME}-sbom.cdx.json`, "utf8"));
            if (sbom.bomFormat !== "CycloneDX" || sbom.metadata?.component?.version !== pkg.version || sbom.metadata?.component?.purl !== `pkg:npm/${pkg.name}@${pkg.version}`) {
              throw new Error("Generated CycloneDX SBOM does not identify this release.");
            }
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.ref_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ github.ref_name }}
          path: release-assets
      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            release-assets/allenlim-memory-server-chatgpt.zip
            release-assets/allenlim-memory-server-chatgpt.zip.sha256
            "release-assets/memory-server-worker-${GITHUB_REF_NAME}-sbom.cdx.json"
          )
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi
